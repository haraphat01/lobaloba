<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Chantilly Bridal Lace in Champagne">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffeac3"/>
      <stop offset=".5" stop-color="#dcc7a0"/>
      <stop offset="1" stop-color="#af9a73"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".18" stop-color="#000" stop-opacity=".18"/>
      <stop offset=".32" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".12"/>
      <stop offset=".68" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".84" stop-color="#000" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dbb4"/><stop offset="1" stop-color="#b49f78"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    
    <pattern id="p" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="14" fill="none" stroke="#ffffdc" stroke-width="1.4" opacity=".55"/>
      <circle cx="30" cy="30" r="6" fill="none" stroke="#ffffe6" stroke-width="1" opacity=".6"/>
      <ellipse cx="30" cy="12" rx="3" ry="7" transform="rotate(0 30 30)" fill="#fffed7" opacity=".35"/><ellipse cx="30" cy="12" rx="3" ry="7" transform="rotate(60 30 30)" fill="#fffed7" opacity=".35"/><ellipse cx="30" cy="12" rx="3" ry="7" transform="rotate(120 30 30)" fill="#fffed7" opacity=".35"/><ellipse cx="30" cy="12" rx="3" ry="7" transform="rotate(180 30 30)" fill="#fffed7" opacity=".35"/><ellipse cx="30" cy="12" rx="3" ry="7" transform="rotate(240 30 30)" fill="#fffed7" opacity=".35"/><ellipse cx="30" cy="12" rx="3" ry="7" transform="rotate(300 30 30)" fill="#fffed7" opacity=".35"/>
      <circle cx="0" cy="0" r="4" fill="#fff9d2" opacity=".4"/><circle cx="60" cy="60" r="4" fill="#fff9d2" opacity=".4"/>
      <circle cx="60" cy="0" r="4" fill="#fff9d2" opacity=".4"/><circle cx="0" cy="60" r="4" fill="#fff9d2" opacity=".4"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#p)"/><rect width="800" height="1000" fill="url(#fold)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  
</svg>